[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cliworker"
version = "0.5.6"
description = "Call claude / codex / gemini / ollama CLIs fast and reliably — speed flags, MCP stripping, chained use, skip-cache."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Travis Somerville", email = "travis.somerville@gmail.com" },
]
keywords = [
    "llm",
    "cli",
    "claude",
    "codex",
    "gemini",
    "ollama",
    "subprocess",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/starshipagentic/cliworker"
Repository = "https://github.com/starshipagentic/cliworker"
Issues = "https://github.com/starshipagentic/cliworker/issues"

[project.scripts]
cliworker = "cliworker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cliworker"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cliworker",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
